<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registeration Form</title>
</head>

<body>

    <!-- Main content of page -->

    <h1>Student's Registeration Form</h1>

    <form>
        <label for="name">Name of the student</label><br>
        <input type="text" id="name" placeholder="Enter your name" required><br><br>

        <label for="dob">DOB</label><br>
        <input type="date" id="dob" required><br><br>

        <label for="age">Age</label><br>
        <input type="number" id="age" placeholder="age" min="18" max="40" required><br><br>

        <label for="email">Email ID</label><br>
        <input type="email" placeholder="a1b2c@gmail.com" required><br><br>

        <label for="mobile no.">Mobile Number</label><br>
        <input type="tel" id="mobile no." required><br><br>

        <label for="address">Address</label><br>
        <input type="text" id="address" required><br><br>

        <label for="gender">Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="course">Select Course</label><br>
        <select name="course" id="course">
            <option value="">Choose a course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BBA">BBA</option>
            <option value="MSC">MSC</option>
        </select><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset Form</button>


    </form>


</body>

</html>
